<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Magistrate Cloud Platform</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="appLayout">

        <aside id="sidebar" class="collapsed">

            <h3>Chats</h3>


            <div id="chatSessionsContainer">


            </div>


    <hr>


            <div id="sidebarButtons">

                <button class="sidebarButton">
                    Knowledge Base
                </button>

                <button class="sidebarButton">
                    Settings
                </button>
                
                <button class="sidebarButton">
                    About
                </button>

            </div>

        </aside>

   

        <button id="sidebarToggle">
            ☰
        </button>
        

        <div id="mainContent">

            <header id="header">
                MagHub
            </header>

            <main id="chatContainer">


            </main>
        
        </div>

        <footer id="inputBar">

            <input
                type="text" 
                id="question"
                placeholder="Ask me anything..."
                >

            <button id="askButton">Ask</button>

        </footer>

    </div>


    <div id="contextMenu">

        <div id="renameChat">
            Rename
        </div>

        <div id="deleteChat">
            Delete
        </div>

    </div>
        

    <!-- loads the marked JS library so app can convert AI markdown into proper HTML format -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="script.js"></script>

 </body>
