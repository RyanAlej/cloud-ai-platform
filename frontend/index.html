<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Magistrate Cloud Platform</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

    <div id="appLayout">

        <div class="new-chat-message">

        </div>

        <aside id="sidebar" class="collapsed">

            <h3>Chats</h3>


            <div id="chatSessionsContainer">


            </div>


            <div id="sidebarButtons">

                <button id ="knowledgeBaseButton" class="sidebarButton">
                    Knowledge Base
                </button>

                <button id = "settingsButton" class="sidebarButton">
                    Settings
                </button>
                
                <button id = "aboutButton" class="sidebarButton">
                    About
                </button>

            </div>

            <button id="newChatButton">
                +
            </button>

        </aside>


        <div id="knowledgeBaseContainer">

            <button id="closeKnowledgeBaseButton">&times;</button>

            <hr>

            <h2>Resources</h2>

            <div class="knowledge-source">

                <h3>Virginia Code</h3>
                <p>Official statutory law of the Commonwealth of Virginia.</p>
                <a href="SOURCE_URL_HERE" target="_blank">View Source</a>
            </div>

            <div class="knowledge-source">

                <h3>Virginia Magistrate Manual</h3>
                <p>Reference material for Virginia magistrate procedures and duties.</p>
                <a href="SOURCE_URL_HERE" target="_blank">View Source</a>
            </div>

            <div class="knowledge-source">

                <h3></h3>
                <p></p>
                <a href="SOURCE_URL_HERE" target="_blank">View Source</a>
            </div>
        </div>


        <button id="sidebarToggle">
            ☰
        </button>
        

        <div id="mainContent">

            <header id="header">
                MagHub
            </header>


            <main id="chatContainer">


            </main>
        

        </div>

        <footer id="inputBar">

            <input
                type="text" 
                id="question"
                placeholder="Ask me anything..."
                >

            <button id="askButton">Ask</button>

        </footer>

    </div>


    <div id="contextMenu">

        <div id="renameChat">
            Rename
        </div>

        <div id="deleteChat">
            Delete
        </div>

    </div>
        

    <!-- loads the marked JS library so app can convert AI markdown into proper HTML format -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="/static/script.js"></script>

 </body>
